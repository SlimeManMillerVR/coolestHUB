<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coolest's Photos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 30px 15px 20px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 900;
    }

    .folders-button-container {
      margin-top: 15px;
    }

    .folders-button {
      display: inline-block;
      padding: 10px 24px;
      background: white;
      color: #111;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1.5px;
      border-radius: 6px;
      transition: background 0.2s, transform 0.2s;
    }

    .folders-button:hover {
      background: #ddd;
      transform: scale(1.05);
    }

    .header-line {
      width: 80%;
      max-width: 700px;
      height: 3px;
      background: white;
      margin: 18px auto 0;
    }

    .page-section {
      width: 100%;
      padding: 35px 20px 60px;
      text-align: center;
    }

    .section-title {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 900;
      margin: 0 0 25px;
      letter-spacing: 2px;
    }

    /* SLIDER */

    .slider {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      touch-action: pan-y;
      user-select: none;
    }

    .slider-image {
      display: block;
      width: 100%;
      height: min(65vh, 650px);
      object-fit: contain;
      background: #080808;
      border-radius: 10px;
      cursor: pointer;
    }

    .slider-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 30px;
      cursor: pointer;
      z-index: 2;
      transition: background 0.2s, transform 0.2s;
    }

    .slider-button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-50%) scale(1.1);
    }

    .slider-button.prev {
      left: 12px;
    }

    .slider-button.next {
      right: 12px;
    }

    .image-counter {
      margin-top: 14px;
      color: #bbb;
      font-size: 15px;
    }

    /* DOTS */

    .dots {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-top: 16px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: none;
      padding: 0;
      background: #555;
      cursor: pointer;
      transition: 0.2s;
    }

    .dot.active {
      background: white;
      transform: scale(1.3);
    }

    footer {
      padding: 25px 15px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .page-section {
        padding: 25px 12px 45px;
      }

      .slider-image {
        height: 50vh;
      }

      .slider-button {
        width: 40px;
        height: 40px;
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Coolest's Photos</h1>

    <div class="folders-button-container">
      <a class="folders-button" href="folder.html">FOLDERS</a>
    </div>

    <div class="header-line"></div>
  </header>

  <!-- HERO X HERO -->
  <section class="page-section" id="hero">
    <h2 class="section-title">HERO X HERO</h2>

    <div class="slider" id="heroSlider">
      <button class="slider-button prev" id="heroPrev">&#10094;</button>

      <a id="heroLink" href="phoooto1.png" target="_blank" rel="noopener">
        <img class="slider-image" id="heroImage" src="phoooto1.png" alt="Hero photo 1">
      </a>

      <button class="slider-button next" id="heroNext">&#10095;</button>
    </div>

    <div class="image-counter" id="heroCounter">1 / 7</div>
    <div class="dots" id="heroDots"></div>
  </section>

  <!-- UG -->
  <section class="page-section" id="ug">
    <h2 class="section-title">UG</h2>

    <div class="slider" id="ugSlider">
      <button class="slider-button prev" id="ugPrev">&#10094;</button>

      <a id="ugLink" href="ugphoooto1.png" target="_blank" rel="noopener">
        <img class="slider-image" id="ugImage" src="ugphoooto1.png" alt="UG photo 1">
      </a>

      <button class="slider-button next" id="ugNext">&#10095;</button>
    </div>

    <div class="image-counter" id="ugCounter">1 / 2</div>
    <div class="dots" id="ugDots"></div>
  </section>

  <footer>
    Coolest's Photos
  </footer>

  <script>
    function createSlider(config) {
      let current = 0;
      let startX = 0;
      let startY = 0;

      const image = document.getElementById(config.image);
      const link = document.getElementById(config.link);
      const counter = document.getElementById(config.counter);
      const dotsContainer = document.getElementById(config.dots);
      const slider = document.getElementById(config.slider);

      function update() {
        const file = config.images[current];

        image.src = "";
        image.src = file + "?slide=" + current;

        image.alt = config.name + " photo " + (current + 1);
        link.href = file;
        counter.textContent = (current + 1) + " / " + config.images.length;

        [...dotsContainer.children].forEach((dot, index) => {
          dot.classList.toggle("active", index === current);
        });
      }

      function goTo(index) {
        current = (index + config.images.length) % config.images.length;
        update();
      }

      config.images.forEach((_, index) => {
        const dot = document.createElement("button");
        dot.className = "dot";
        dot.setAttribute("aria-label", "Go to photo " + (index + 1));
        dot.addEventListener("click", () => goTo(index));
        dotsContainer.appendChild(dot);
      });

      document.getElementById(config.prev).addEventListener("click", () => {
        goTo(current - 1);
      });

      document.getElementById(config.next).addEventListener("click", () => {
        goTo(current + 1);
      });

      slider.addEventListener("touchstart", (event) => {
        startX = event.changedTouches[0].screenX;
        startY = event.changedTouches[0].screenY;
      }, { passive: true });

      slider.addEventListener("touchend", (event) => {
        const dx = event.changedTouches[0].screenX - startX;
        const dy = event.changedTouches[0].screenY - startY;

        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
          goTo(current + (dx < 0 ? 1 : -1));
        }
      }, { passive: true });

      update();
    }

    createSlider({
      name: "HERO",
      images: [
        "phoooto1.png",
        "phoooto2.png",
        "phoooto3.png",
        "phoooto4.png",
        "phoooto5.png",
        "phoooto6.png",
        "phoooto7.png"
      ],
      slider: "heroSlider",
      image: "heroImage",
      link: "heroLink",
      counter: "heroCounter",
      dots: "heroDots",
      prev: "heroPrev",
      next: "heroNext"
    });

    createSlider({
      name: "UG",
      images: [
        "ugphoooto1.png",
        "ugphoooto2.png"
      ],
      slider: "ugSlider",
      image: "ugImage",
      link: "ugLink",
      counter: "ugCounter",
      dots: "ugDots",
      prev: "ugPrev",
      next: "ugNext"
    });
  </script>

</body>
</html>
