<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coolest's Photos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 30px 15px 20px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 900;
    }

    .header-line {
      width: 80%;
      max-width: 700px;
      height: 3px;
      background: white;
      margin: 18px auto 0;
    }

    .page-section {
      width: 100%;
      padding: 35px 20px 60px;
      text-align: center;
    }

    .section-title {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 900;
      margin: 0 0 25px;
      letter-spacing: 2px;
    }

    /* HERO X HERO SLIDER */

    .hero-slider {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: min(65vh, 650px);
      object-fit: contain;
      background: #080808;
      border-radius: 10px;
      cursor: pointer;
    }

    .slider-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 30px;
      cursor: pointer;
      z-index: 2;
    }

    .slider-button:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .slider-button.prev {
      left: 12px;
    }

    .slider-button.next {
      right: 12px;
    }

    .image-counter {
      margin-top: 14px;
      color: #bbb;
      font-size: 15px;
    }

    /* SOON SECTION */

    .soon-section {
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #191919;
    }

    .soon-section .section-title {
      font-size: clamp(40px, 8vw, 75px);
      margin: 0;
    }

    /* UG GALLERY */

    .ug-gallery {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .ug-gallery a {
      display: block;
      background: #080808;
      border-radius: 10px;
      overflow: hidden;
    }

    .ug-gallery img {
      display: block;
      width: 100%;
      height: 350px;
      object-fit: contain;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .ug-gallery img:hover {
      transform: scale(1.03);
    }

    footer {
      padding: 25px 15px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .page-section {
        padding: 25px 12px 45px;
      }

      .hero-image {
        height: 50vh;
      }

      .slider-button {
        width: 40px;
        height: 40px;
        font-size: 25px;
      }

      .ug-gallery {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .ug-gallery img {
        height: 300px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Coolest's Photos</h1>
    <div class="header-line"></div>
  </header>

  <!-- HERO X HERO -->
  <section class="page-section" id="hero">
    <h2 class="section-title">HERO X HERO</h2>

    <div class="hero-slider">
      <button class="slider-button prev" id="prevButton" aria-label="Previous image">
        &#10094;
      </button>

      <a id="heroImageLink" href="phoooto1.png" target="_blank" rel="noopener">
        <img
          class="hero-image"
          id="heroImage"
          src="phoooto1.png"
          alt="Hero photo 1"
        >
      </a>

      <button class="slider-button next" id="nextButton" aria-label="Next image">
        &#10095;
      </button>
    </div>

    <div class="image-counter" id="imageCounter">1 / 7</div>
  </section>

  <!-- SOON -->

  <!-- UG -->
  <section class="page-section" id="ug">
    <h2 class="section-title">UG</h2>

    <div class="ug-gallery">
      <a href="ugphoooto1.png" target="_blank" rel="noopener">
        <img src="ugphoooto1.png" alt="UG photo 1">
      </a>

      <a href="ugphoooto2.png" target="_blank" rel="noopener">
        <img src="ugphoooto2.png" alt="UG photo 2">
      </a>
    </div>
  </section>

  <footer>
    Coolest's Photos
  </footer>

  <script>
    const heroImages = [
      "phoooto1.png",
      "phoooto2.png",
      "phoooto3.png",
      "phoooto4.png",
      "phoooto5.png",
      "phoooto6.png",
      "phoooto7.png"
    ];

    let currentImage = 0;

    const heroImage = document.getElementById("heroImage");
    const heroImageLink = document.getElementById("heroImageLink");
    const imageCounter = document.getElementById("imageCounter");

    function showImage(index) {
      currentImage = (index + heroImages.length) % heroImages.length;

      const imageName = heroImages[currentImage];

      heroImage.src = imageName;
      heroImage.alt = "Hero photo " + (currentImage + 1);
      heroImageLink.href = imageName;
      imageCounter.textContent =
        (currentImage + 1) + " / " + heroImages.length;
    }

    document.getElementById("prevButton").addEventListener("click", () => {
      showImage(currentImage - 1);
    });

    document.getElementById("nextButton").addEventListener("click", () => {
      showImage(currentImage + 1);
    });

    // Swipe left or right to change HERO photos
    let touchStartX = 0;
    let touchStartY = 0;

    const slider = document.querySelector(".hero-slider");

    slider.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].screenX;
      touchStartY = event.changedTouches[0].screenY;
    }, { passive: true });

    slider.addEventListener("touchend", (event) => {
      const touchEndX = event.changedTouches[0].screenX;
      const touchEndY = event.changedTouches[0].screenY;

      const differenceX = touchEndX - touchStartX;
      const differenceY = touchEndY - touchStartY;

      // Only change photos when the gesture is mainly horizontal
      if (Math.abs(differenceX) > 50 && Math.abs(differenceX) > Math.abs(differenceY)) {
        if (differenceX < 0) {
          showImage(currentImage + 1);
        } else {
          showImage(currentImage - 1);
        }
      }
    }, { passive: true });
  </script>

</body>
</html>
