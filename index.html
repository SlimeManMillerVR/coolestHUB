
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coolest's Photos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gallery {
      width: 100%;
      max-width: 850px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 25px;
    }

    .slider {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #222;
    }

    .slides {
      display: flex;
      transition: transform 0.4s ease;
    }

    .slides img {
      width: 100%;
      flex: 0 0 100%;
      height: 520px;
      object-fit: contain;
      cursor: pointer;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 25px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      cursor: pointer;
    }

    .prev {
      left: 12px;
    }

    .next {
      right: 12px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .dot {
      position: static;
      transform: none;
      width: 10px;
      height: 10px;
      padding: 0;
      background: #666;
    }

    .dot.active {
      background: white;
      transform: scale(1.3);
    }

    .counter {
      margin-top: 15px;
      color: #aaa;
    }

    @media (max-width: 600px) {
      .slides img {
        height: 380px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <div class="gallery">
    <h1>Coolest's Photos</h1>

    <div class="slider" id="slider">
      <div class="slides" id="slides">
        <img src="phoooto1.png" alt="Photo 1">
        <img src="phoooto2.png" alt="Photo 2">
        <img src="phoooto3.png" alt="Photo 3">
        <img src="phoooto4.png" alt="Photo 4">
        <img src="phoooto5.png" alt="Photo 5">
        <img src="phoooto6.png" alt="Photo 6">
        <img src="phoooto7.png" alt="Photo 7">
      </div>

      <button class="prev" onclick="move(-1)" aria-label="Previous photo">
        &#10094;
      </button>

      <button class="next" onclick="move(1)" aria-label="Next photo">
        &#10095;
      </button>
    </div>

    <div class="dots" id="dots"></div>
    <div class="counter" id="counter">1 / 7</div>
  </div>

  <script>
    const slides = document.getElementById("slides");
    const dots = document.getElementById("dots");
    const counter = document.getElementById("counter");
    const slider = document.getElementById("slider");

    const total = 7;
    let current = 0;
    let startX = 0;

    for (let i = 0; i < total; i++) {
      const dot = document.createElement("button");
      dot.className = "dot";
      dot.setAttribute("aria-label", `Go to photo ${i + 1}`);
      dot.onclick = () => show(i);
      dots.appendChild(dot);
    }

    function show(index) {
      current = (index + total) % total;
      slides.style.transform =
        `translateX(-${current * 100}%)`;

      document.querySelectorAll(".dot").forEach((dot, i) => {
        dot.classList.toggle("active", i === current);
      });

      counter.textContent = `${current + 1} / ${total}`;
    }

    function move(direction) {
      show(current + direction);
    }

    slider.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
    });

    slider.addEventListener("touchend", e => {
      const difference = e.changedTouches[0].clientX - startX;

      if (difference > 50) move(-1);
      if (difference < -50) move(1);
    });

    document.querySelectorAll(".slides img").forEach(img => {
      img.onclick = () => window.open(img.src, "_blank");
    });

    show(0);
  </script>
</body>
</html>
