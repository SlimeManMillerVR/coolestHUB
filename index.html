<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coolest's Photos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 30px 15px 20px;
    }

    header h1 {
      display: inline-block;
      margin: 0;
      font-size: 32px;
      border-bottom: 3px solid white;
      padding-bottom: 8px;
    }

    section {
      width: 100%;
      max-width: 850px;
      margin: 35px auto 55px;
      padding: 0 15px;
    }

    section h2 {
      font-size: 25px;
      margin-bottom: 20px;
    }

    .slider {
      position: relative;
      width: 100%;
    }

    .photo-frame {
      width: 100%;
      height: min(70vh, 650px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      overflow: hidden;
    }

    .photo {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 28px;
      cursor: pointer;
      z-index: 2;
    }

    .arrow:hover {
      background: rgba(60, 60, 60, 0.9);
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }

    .photo-count {
      margin-top: 12px;
      font-size: 15px;
      color: #ccc;
    }

    .dots {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border: none;
      border-radius: 50%;
      background: #555;
      padding: 0;
      cursor: pointer;
    }

    .dot.active {
      background: white;
      transform: scale(1.25);
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      section h2 {
        font-size: 22px;
      }

      .photo-frame {
        height: 60vh;
      }

      .arrow {
        width: 38px;
        height: 38px;
        font-size: 24px;
      }

      .prev {
        left: 5px;
      }

      .next {
        right: 5px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Coolest's Photos</h1>
  </header>

  <section>
    <h2>HERO X HERO</h2>

    <div class="slider" id="hero-slider">
      <div class="photo-frame">
        <img class="photo" id="hero-photo" src="phoooto1.png" alt="Hero photo 1">
      </div>

      <button class="arrow prev" aria-label="Previous photo">‹</button>
      <button class="arrow next" aria-label="Next photo">›</button>

      <div class="photo-count" id="hero-count">1 / 7</div>
      <div class="dots" id="hero-dots"></div>
    </div>
  </section>

  <section>
    <h2>UG</h2>

    <div class="slider" id="ug-slider">
      <div class="photo-frame">
        <img class="photo" id="ug-photo" src="ugphoooto1.png" alt="UG photo 1">
      </div>

      <button class="arrow prev" aria-label="Previous photo">‹</button>
      <button class="arrow next" aria-label="Next photo">›</button>

      <div class="photo-count" id="ug-count">1 / 2</div>
      <div class="dots" id="ug-dots"></div>
    </div>
  </section>

  <script>
    function createSlider(sliderId, imageId, countId, dotsId, imageList) {
      const slider = document.getElementById(sliderId);
      const image = document.getElementById(imageId);
      const count = document.getElementById(countId);
      const dotsContainer = document.getElementById(dotsId);

      let currentIndex = 0;
      let touchStartX = 0;

      // Her slider kendi imageList ve currentIndex değerini kullanır.
      function showPhoto(index) {
        currentIndex = (index + imageList.length) % imageList.length;

        // Fotoğraf kaynağını doğrudan seçilen dosyadan güncelle.
        image.src = imageList[currentIndex];
        image.alt = `Photo ${currentIndex + 1}`;

        count.textContent = `${currentIndex + 1} / ${imageList.length}`;

        const dots = dotsContainer.querySelectorAll(".dot");
        dots.forEach((dot, i) => {
          dot.classList.toggle("active", i === currentIndex);
        });
      }

      // Her fotoğraf için kendi noktasını oluştur.
      imageList.forEach((_, index) => {
        const dot = document.createElement("button");
        dot.className = "dot";
        dot.setAttribute("aria-label", `Go to photo ${index + 1}`);
        dot.addEventListener("click", () => showPhoto(index));
        dotsContainer.appendChild(dot);
      });

      slider.querySelector(".prev").addEventListener("click", () => {
        showPhoto(currentIndex - 1);
      });

      slider.querySelector(".next").addEventListener("click", () => {
        showPhoto(currentIndex + 1);
      });

      // Telefonda sağa-sola kaydırma.
      slider.addEventListener("touchstart", event => {
        touchStartX = event.changedTouches[0].screenX;
      }, { passive: true });

      slider.addEventListener("touchend", event => {
        const touchEndX = event.changedTouches[0].screenX;
        const difference = touchEndX - touchStartX;

        if (Math.abs(difference) > 45) {
          showPhoto(difference < 0 ? currentIndex + 1 : currentIndex - 1);
        }
      }, { passive: true });

      showPhoto(0);
    }

    // HERO slider: 7 ayrı dosya
    createSlider(
      "hero-slider",
      "hero-photo",
      "hero-count",
      "hero-dots",
      [
        "phoooto1.png",
        "phoooto2.png",
        "phoooto3.png",
        "phoooto4.png",
        "phoooto5.png",
        "phoooto6.png",
        "phoooto7.png"
      ]
    );

    // UG slider: 2 ayrı dosya
    createSlider(
      "ug-slider",
      "ug-photo",
      "ug-count",
      "ug-dots",
      [
        "ugphoooto1.png",
        "ugphoooto2.png"
      ]
    );
  </script>
</body>
</html>
