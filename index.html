<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coolest's Photos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 30px 15px 20px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 900;
    }

    .header-line {
      width: 80%;
      max-width: 700px;
      height: 3px;
      background: white;
      margin: 18px auto 0;
    }

    .page-section {
      width: 100%;
      padding: 35px 20px 60px;
      text-align: center;
    }

    .section-title {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 900;
      margin: 0 0 25px;
      letter-spacing: 2px;
    }

    /* SLIDERS */

    .slider {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .slider-image {
      display: block;
      width: 100%;
      height: min(65vh, 650px);
      object-fit: contain;
      background: #080808;
      border-radius: 10px;
      cursor: pointer;
    }

    .slider-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 30px;
      cursor: pointer;
      z-index: 2;
    }

    .slider-button:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .slider-button.prev {
      left: 12px;
    }

    .slider-button.next {
      right: 12px;
    }

    .image-counter {
      margin-top: 14px;
      color: #bbb;
      font-size: 15px;
    }

    /* UG SECTION */

    #ug {
      background: #191919;
    }

    footer {
      padding: 25px 15px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .page-section {
        padding: 25px 12px 45px;
      }

      .slider-image {
        height: 50vh;
      }

      .slider-button {
        width: 40px;
        height: 40px;
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Coolest's Photos</h1>
    <div class="header-line"></div>
  </header>

  <!-- HERO X HERO: 7 PHOTOS -->
  <section class="page-section" id="hero">
    <h2 class="section-title">HERO X HERO</h2>

    <div class="slider">
      <button class="slider-button prev" id="heroPrev" aria-label="Previous photo">
        &#10094;
      </button>

      <a id="heroLink" href="phoooto1.png" target="_blank" rel="noopener">
        <img
          class="slider-image"
          id="heroImage"
          src="phoooto1.png"
          alt="Hero photo 1"
        >
      </a>

      <button class="slider-button next" id="heroNext" aria-label="Next photo">
        &#10095;
      </button>
    </div>

    <div class="image-counter" id="heroCounter">1 / 7</div>
  </section>

  <!-- UG: 2 PHOTOS -->
  <section class="page-section" id="ug">
    <h2 class="section-title">UG</h2>

    <div class="slider">
      <button class="slider-button prev" id="ugPrev" aria-label="Previous UG photo">
        &#10094;
      </button>

      <a id="ugLink" href="ugphoooto1.png" target="_blank" rel="noopener">
        <img
          class="slider-image"
          id="ugImage"
          src="ugphoooto1.png"
          alt="UG photo 1"
        >
      </a>

      <button class="slider-button next" id="ugNext" aria-label="Next UG photo">
        &#10095;
      </button>
    </div>

    <div class="image-counter" id="ugCounter">1 / 2</div>
  </section>

  <footer>
    Coolest's Photos
  </footer>

  <script>
    // HERO slider
    const heroImages = [
      "phoooto1.png",
      "phoooto2.png",
      "phoooto3.png",
      "phoooto4.png",
      "phoooto5.png",
      "phoooto6.png",
      "phoooto7.png"
    ];

    let heroIndex = 0;

    function showHero(index) {
      heroIndex = (index + heroImages.length) % heroImages.length;

      const file = heroImages[heroIndex];
      document.getElementById("heroImage").src = file;
      document.getElementById("heroImage").alt = "Hero photo " + (heroIndex + 1);
      document.getElementById("heroLink").href = file;
      document.getElementById("heroCounter").textContent =
        (heroIndex + 1) + " / " + heroImages.length;
    }

    document.getElementById("heroPrev").addEventListener("click", () => {
      showHero(heroIndex - 1);
    });

    document.getElementById("heroNext").addEventListener("click", () => {
      showHero(heroIndex + 1);
    });

    // UG slider
    const ugImages = [
      "ugphoooto1.png",
      "ugphoooto2.png"
    ];

    let ugIndex = 0;

    function showUG(index) {
      ugIndex = (index + ugImages.length) % ugImages.length;

      const file = ugImages[ugIndex];
      document.getElementById("ugImage").src = file;
      document.getElementById("ugImage").alt = "UG photo " + (ugIndex + 1);
      document.getElementById("ugLink").href = file;
      document.getElementById("ugCounter").textContent =
        (ugIndex + 1) + " / " + ugImages.length;
    }

    document.getElementById("ugPrev").addEventListener("click", () => {
      showUG(ugIndex - 1);
    });

    document.getElementById("ugNext").addEventListener("click", () => {
      showUG(ugIndex + 1);
    });

    // Touch swipe for both sliders
    function enableSwipe(slider, showFunction, getIndex, total) {
      let startX = 0;
      let startY = 0;

      slider.addEventListener("touchstart", (event) => {
        startX = event.changedTouches[0].screenX;
        startY = event.changedTouches[0].screenY;
      }, { passive: true });

      slider.addEventListener("touchend", (event) => {
        const endX = event.changedTouches[0].screenX;
        const endY = event.changedTouches[0].screenY;

        const dx = endX - startX;
        const dy = endY - startY;

        // Only change photos on a mostly horizontal swipe
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) {
            showFunction(getIndex() + 1);
          } else {
            showFunction(getIndex() - 1);
          }
        }
      }, { passive: true });
    }

    enableSwipe(
      document.querySelector("#hero .slider"),
      showHero,
      () => heroIndex,
      heroImages.length
    );

    enableSwipe(
      document.querySelector("#ug .slider"),
      showUG,
      () => ugIndex,
      ugImages.length
    );
  </script>

</body>
</html>
