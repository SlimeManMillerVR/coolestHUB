
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coolest's Photos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      text-align: center;
      padding: 25px 15px 20px;
    }

    header h1 {
      font-size: 30px;
      margin: 0;
    }

    header hr {
      border: none;
      height: 2px;
      background: white;
      width: 85%;
      max-width: 700px;
      margin: 20px auto 0;
    }

    /* Main horizontal scrolling sections */
    .sections {
      display: flex;
      width: 100%;
      height: calc(100vh - 100px);
      overflow-x: scroll;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-x;
    }

    .sections::-webkit-scrollbar {
      display: none;
    }

    .page {
      flex: 0 0 100%;
      min-width: 100%;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      padding: 20px;
    }

    .page h2 {
      text-align: center;
      font-size: 26px;
      margin: 10px 0 25px;
    }

    /* HERO X HERO photo slider */
    .slider {
      position: relative;
      max-width: 850px;
      margin: auto;
      overflow: hidden;
      border-radius: 15px;
      background: #222;
      touch-action: pan-y;
    }

    .slides {
      display: flex;
      transition: transform 0.4s ease;
    }

    .slides img {
      flex: 0 0 100%;
      width: 100%;
      height: 520px;
      object-fit: contain;
      cursor: pointer;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 24px;
      cursor: pointer;
      z-index: 2;
    }

    .prev {
      left: 12px;
    }

    .next {
      right: 12px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .dot {
      position: static;
      transform: none;
      width: 10px;
      height: 10px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #666;
      cursor: pointer;
    }

    .dot.active {
      background: white;
      transform: scale(1.3);
    }

    .counter {
      text-align: center;
      color: #aaa;
      margin-top: 15px;
    }

    /* SOON section */
    .soon {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      font-size: 45px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    /* UG gallery */
    .ug-gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 850px;
      margin: auto;
    }

    .ug-gallery img {
      width: 100%;
      height: 350px;
      object-fit: contain;
      background: #222;
      border-radius: 12px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 25px;
      }

      .page h2 {
        font-size: 23px;
      }

      .slides img {
        height: 380px;
      }

      .ug-gallery img {
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Coolest's Photos</h1>
    <hr>
  </header>

  <main class="sections">

    <!-- Section 1: HERO X HERO -->
    <section class="page">
      <h2>HERO X HERO</h2>

      <div class="slider" id="slider">
        <div class="slides" id="slides">
          <img src="phoooto1.png" alt="Photo 1">
          <img src="phoooto2.png" alt="Photo 2">
          <img src="phoooto3.png" alt="Photo 3">
          <img src="phoooto4.png" alt="Photo 4">
          <img src="phoooto5.png" alt="Photo 5">
          <img src="phoooto6.png" alt="Photo 6">
          <img src="phoooto7.png" alt="Photo 7">
        </div>

        <button class="arrow prev"
          onclick="move(-1)"
          aria-label="Previous photo">&#10094;</button>

        <button class="arrow next"
          onclick="move(1)"
          aria-label="Next photo">&#10095;</button>
      </div>

      <div class="dots" id="dots"></div>
      <div class="counter" id="counter">1 / 7</div>
    </section>

    <!-- Section 2: SOON -->
    <section class="page">
      <h2>SOON!</h2>
      <div class="soon">SOON!</div>
    </section>

    <!-- Section 3: UG -->
    <section class="page">
      <h2>UG</h2>

      <div class="ug-gallery">
        <img src="ugphoooto1.png" alt="UG Photo 1">
        <img src="ugphoooto2.png" alt="UG Photo 2">
      </div>
    </section>

  </main>

  <script>
    // HERO X HERO photo slider
    const slides = document.getElementById("slides");
    const dots = document.getElementById("dots");
    const counter = document.getElementById("counter");
    const slider = document.getElementById("slider");

    const total = 7;
    let current = 0;
    let startX = 0;

    // Create navigation dots
    for (let i = 0; i < total; i++) {
      const dot = document.createElement("button");
      dot.className = "dot";
      dot.setAttribute("aria-label", `Go to photo ${i + 1}`);
      dot.onclick = () => show(i);
      dots.appendChild(dot);
    }

    // Show selected photo
    function show(index) {
      current = (index + total) % total;

      slides.style.transform =
        `translateX(-${current * 100}%)`;

      document.querySelectorAll(".dot").forEach((dot, i) => {
        dot.classList.toggle("active", i === current);
      });

      counter.textContent = `${current + 1} / ${total}`;
    }

    // Previous / next photo
    function move(direction) {
      show(current + direction);
    }

    // Swipe photos on touchscreen
    slider.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
    }, { passive: true });

    slider.addEventListener("touchend", e => {
      const difference =
        e.changedTouches[0].clientX - startX;

      if (difference > 50) move(-1);
      if (difference < -50) move(1);
    }, { passive: true });

    // Mouse wheel scrolling between sections
    const sections = document.querySelector(".sections");

    sections.addEventListener("wheel", e => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        sections.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    // Open photos in a new tab
    document.querySelectorAll(".slides img, .ug-gallery img")
      .forEach(img => {
        img.onclick = () => window.open(img.src, "_blank");
      });

    show(0);
  </script>

</body>
</html>
